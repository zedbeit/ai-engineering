[project]
name = "expense-tracker"
version = "0.1.0"
description = "Typed command-line expense tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
expense = "expense_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
